# Multi-screen flow: Next -> required question (Continue is disabled) -> answer -> Continue -> Back -> Back -> Close.
# Placement "flow" in the stub server. Set the sample's placement field to "flow" first.
appId: app.miniwall.example
---
- launchApp   # keeps the configuration of purchase.yaml (run it first), or repeat its first steps
- tapOn:
    id: "placement-input"
- eraseText: 20
- inputText: "flow"
- hideKeyboard
- tapOn:
    id: "present-button"
- assertVisible: "Welcome aboard"
- tapOn: "Next"
- assertVisible: "What is your goal?"
- assertVisible:
    text: "Continue"
    enabled: false
- tapOn: "Lose weight"
- assertVisible:
    text: "Continue"
    enabled: true
- tapOn: "Continue"
- assertVisible: "All set"
- tapOn: "Back"
- assertVisible: "What is your goal?"
- assertVisible:
    text: "Lose weight"
    selected: true                 # the answer survives going back
- tapOn: "Back"
- assertVisible: "Welcome aboard"
- tapOn: "Close"
- assertVisible:
    id: "result-text"
    text: ".*closed.*lose_weight.*"
