# Android system Back: first screen closes ("closed"); inside a flow it is screen:back (previous screen).
# NOTE: the Android SDK currently closes the whole presentation on system Back even inside a flow
# (MiniwallActivity.handleOnBackPressed -> close()); the second half of this flow fails until that is changed.
appId: app.miniwall.example
---
- launchApp   # keeps the configuration of purchase.yaml (run it first), or repeat its first steps
- tapOn:
    id: "present-button"
- assertVisible: "Go Pro"
- back
- assertVisible:
    id: "result-text"
    text: ".*closed.*"
- tapOn:
    id: "placement-input"
- eraseText: 20
- inputText: "flow"
- hideKeyboard
- tapOn:
    id: "present-button"
- tapOn: "Next"
- assertVisible: "What is your goal?"
- back
- assertVisible: "Welcome aboard"   # screen:back, not closed
- back
- assertVisible:
    id: "result-text"
    text: ".*closed.*"
