name: Release

# Publishes @miniwall/react-native to npm when a version tag is pushed. It needs the iOS pod and the Android artifact
# of the same version to exist first (guard checks both). Nothing is published until the owner creates the `publish`
# environment with required reviewers and sets the repository variable PUBLISH_ENABLED=true.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  guard:
    name: tag checks
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.g.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: g
        env:
          TAG: ${{ github.ref_name }}
          ENABLED: ${{ vars.PUBLISH_ENABLED }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tag $TAG is not on main"; exit 1; }
          v=$(node -p "require('./package.json').version")
          [ "$v" = "$TAG" ] || { echo "::error::tag $TAG does not match package.json ($v)"; exit 1; }
          grep -qE "^## ${TAG//./\\.}( |$)" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $TAG' section"; exit 1; }
          android=$(sed -n 's/.*"app.miniwall:sdk:\([^"]*\)".*/\1/p' android/build.gradle)
          curl -fsSI "https://repo1.maven.org/maven2/app/miniwall/sdk/$android/sdk-$android.pom" >/dev/null || { echo "::error::app.miniwall:sdk:$android is not on Maven Central yet"; exit 1; }
          curl -fsS https://trunk.cocoapods.org/api/v1/pods/MiniwallSDK | grep -q '"name":"0\.' || { echo "::error::MiniwallSDK is not on CocoaPods yet"; exit 1; }
          echo "enabled=${ENABLED:-false}" >> "$GITHUB_OUTPUT"

  publish:
    name: publish to npm
    needs: guard
    if: needs.guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: scripts/fetch-spec.sh
      - run: npm ci && npm run typecheck && npm test
      - run: npm pack --dry-run
      # First publish needs a token (see the web workflow); afterwards switch to trusted publishing and delete NPM_TOKEN.
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
